<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d24">
<title>Mes dés 3D</title>
<style>
  :root {
    --felt-dark: #0f3d24;
    --panel: rgba(8, 22, 14, 0.74);
    --text: #f0fdf4;
    --muted: #bbf7d0;
    --accent: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--felt-dark); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  .bar {
    position: fixed; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; pointer-events: none; flex-wrap: wrap;
  }
  .bar > * { pointer-events: auto; }
  .top { top: 0; padding-top: max(12px, env(safe-area-inset-top)); }
  .bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); flex-direction: column; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .panel {
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 18px; box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  .result { padding: 8px 16px; font-size: 15px; color: var(--muted); max-width: 100%; text-align: center; line-height: 1.5; }
  .result b.total { color: var(--text); font-size: 24px; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .result .v { display: inline-block; padding: 0 6px; margin: 1px; border-radius: 6px; color: #111; font-weight: 700; font-variant-numeric: tabular-nums; }
  .result small { opacity: .75; font-size: 11px; font-weight: 500; }

  button {
    font: inherit; color: var(--text); border: 0; cursor: pointer;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 999px; padding: 10px 16px; font-size: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  button:active { transform: scale(.95); }
  button.primary { background: var(--accent); color: #1c1917; font-weight: 700; padding: 12px 22px; font-size: 16px; }

  .tray { display: flex; gap: 5px; padding: 8px 6px 6px; flex-wrap: wrap; justify-content: center; }
  .chip {
    position: relative; min-width: 42px; padding: 9px 7px; font-weight: 700; font-size: 14px;
    border-radius: 12px; box-shadow: none; background: rgba(255,255,255,.08);
    border-bottom: 3px solid var(--c);
  }
  .chip.on { background: color-mix(in srgb, var(--c) 35%, transparent); }
  .chip .badge {
    position: absolute; top: -8px; right: -8px; min-width: 22px; height: 22px; padding: 0 5px;
    border-radius: 11px; background: #f8fafc; color: #111; font-size: 12px; line-height: 22px;
    display: none; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .chip.on .badge { display: block; }
  .chip .badge::after { content: " −"; color: #b91c1c; }
  #shakeBtn[hidden] { display: none; }

  .sheet {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 4;
    width: min(420px, 100%); max-height: 80%; overflow: auto;
    padding: 16px max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-bottom));
    background: rgba(8, 22, 14, 0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.4);
  }
  .sheet[hidden] { display: none; }
  .sheet h2 { margin: 0 0 4px; font-size: 17px; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .crow { display: grid; grid-template-columns: 52px 1fr 1fr; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .crow b { font-size: 15px; }
  .crow label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .crow input[type=color] {
    width: 44px; height: 32px; padding: 0; border: 2px solid rgba(255,255,255,.25); border-radius: 8px;
    background: none; cursor: pointer;
  }
  .crow input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .crow input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  .hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 1; pointer-events: none; text-align: center; width: 80%;
    color: rgba(240,253,244,.6); font-size: 14px; line-height: 1.6; transition: opacity .6s;
  }
  .hint.gone { opacity: 0; }
  #err {
    position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
    text-align: center; background: var(--felt-dark); z-index: 5;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="bar top">
  <div class="panel result" id="result">Touchez un dé ou secouez le téléphone</div>
</div>

<div class="hint" id="hint">Toucher un dé : le relancer seul<br>Toucher le tapis : tout lancer<br>Bouton d’un type : ajouter · pastille : retirer</div>

<div class="bar bottom">
  <div class="panel tray" id="tray"></div>
  <div class="row">
    <button id="styleBtn">Matière : Marbre</button>
    <button id="colorBtn">🎨 Couleurs</button>
    <button id="clearBtn">Vider</button>
    <button class="primary" id="rollBtn">🎲 Lancer</button>
    <button id="shakeBtn" hidden>📳 Secousse</button>
  </div>
</div>

<div class="sheet" id="colorSheet" hidden>
  <h2>Couleurs des dés</h2>
  <p>Corps et chiffres, pour chaque type de dé.</p>
  <div id="colorRows"></div>
  <div class="actions">
    <button id="colorReset">Couleurs d’origine</button>
    <button class="primary" id="colorClose">Terminé</button>
  </div>
</div>

<div id="err">Impossible de charger la 3D (connexion internet requise pour les bibliothèques).</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

window.__diceLoaded = true;

/* =========================================================
   Types de dés
   ========================================================= */
const MAX_DICE = 12;
const TYPES = {
  d4:   { faces: 4,  radius: 1.15, color: '#eab308', ink: '#1c1917' },
  d6:   { faces: 6,  radius: 0.85, color: '#db2777', ink: '#ffffff' },
  d8:   { faces: 8,  radius: 0.95, color: '#2563eb', ink: '#ffffff' },
  d10:  { faces: 10, radius: 0.95, color: '#7c3aed', ink: '#ffffff' },
  d12:  { faces: 12, radius: 1.00, color: '#ea580c', ink: '#ffffff' },
  d20:  { faces: 20, radius: 1.05, color: '#dc2626', ink: '#ffffff' },
  d100: { faces: 10, radius: 0.95, color: '#0d9488', ink: '#ffffff' },
};
const DEFAULT_COLORS = Object.fromEntries(Object.entries(TYPES).map(([k, t]) => [k, { color: t.color, ink: t.ink }]));
try {
  const saved = JSON.parse(localStorage.getItem('dice-colors') || '{}');
  for (const k in saved) if (TYPES[k]) Object.assign(TYPES[k], saved[k]);
} catch (_) {}
const counts = { d4: 0, d6: 2, d8: 0, d10: 0, d12: 0, d20: 0, d100: 0 };

/* ---------- Construction des polyèdres ---------- */
function trianglesFromGeometry(geo) {
  const pos = (geo.index ? geo.toNonIndexed() : geo).attributes.position;
  const tris = [];
  for (let i = 0; i < pos.count; i += 3) {
    tris.push([0, 1, 2].map(k => new THREE.Vector3().fromBufferAttribute(pos, i + k)));
  }
  return tris;
}

function d10Triangles() {
  // Trapézoèdre pentagonal : faces en cerf-volant planes si h = a(1+cos36°)/(1−cos36°)
  const c = Math.cos(Math.PI / 5);
  const h = 1, a = h * (1 - c) / (1 + c);
  const ring = [];
  for (let i = 0; i < 10; i++) {
    const t = i * Math.PI / 5;
    ring.push(new THREE.Vector3(Math.cos(t), i % 2 ? -a : a, Math.sin(t)));
  }
  const T = new THREE.Vector3(0, h, 0), B = new THREE.Vector3(0, -h, 0);
  const tris = [];
  for (let k = 0; k < 5; k++) {
    const u0 = ring[2 * k], l = ring[2 * k + 1], u1 = ring[(2 * k + 2) % 10];
    tris.push([T, u0, l], [T, l, u1]);
    const l0 = ring[2 * k + 1], u = ring[(2 * k + 2) % 10], l1 = ring[(2 * k + 3) % 10];
    tris.push([B, l0, u], [B, u, l1]);
  }
  return tris;
}

// Fusionne les triangles coplanaires en faces, ordonne les sommets (sens trigo vu de l'extérieur)
function buildPolyhedron(tris, radius) {
  const verts = [], vmap = new Map();
  const key = v => v.toArray().map(x => Math.round(x * 1e4)).join(',');
  const idx = v => { const k = key(v); if (!vmap.has(k)) { vmap.set(k, verts.length); verts.push(v.clone()); } return vmap.get(k); };

  const groups = new Map();
  for (const [a, b, c] of tris) {
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
    if (n.dot(a.clone().add(b).add(c)) < 0) n.negate();
    const k = n.toArray().map(x => Math.round(x * 500)).join(',');
    if (!groups.has(k)) groups.set(k, { normal: n, ids: new Set() });
    [a, b, c].forEach(v => groups.get(k).ids.add(idx(v)));
  }

  const maxR = Math.max(...verts.map(v => v.length()));
  verts.forEach(v => v.multiplyScalar(radius / maxR));

  const faces = [...groups.values()].map(({ normal, ids }) => {
    ids = [...ids];
    const center = new THREE.Vector3();
    ids.forEach(i => center.add(verts[i]));
    center.divideScalar(ids.length);
    const u = verts[ids[0]].clone().sub(center).normalize();
    const w = new THREE.Vector3().crossVectors(normal, u);
    const ang = i => { const p = verts[i].clone().sub(center); return Math.atan2(p.dot(w), p.dot(u)); };
    ids.sort((i, j) => ang(i) - ang(j));
    return { normal, center, ids };
  });
  return { verts, faces };
}

function shapeFor(type) {
  const r = TYPES[type].radius;
  switch (type) {
    case 'd4':  return buildPolyhedron(trianglesFromGeometry(new THREE.TetrahedronGeometry(1)), r);
    case 'd6':  return buildPolyhedron(trianglesFromGeometry(new THREE.BoxGeometry(1, 1, 1)), r);
    case 'd8':  return buildPolyhedron(trianglesFromGeometry(new THREE.OctahedronGeometry(1)), r);
    case 'd12': return buildPolyhedron(trianglesFromGeometry(new THREE.DodecahedronGeometry(1)), r);
    case 'd20': return buildPolyhedron(trianglesFromGeometry(new THREE.IcosahedronGeometry(1)), r);
    default:    return buildPolyhedron(d10Triangles(), r);     // d10 & d100
  }
}

// Valeurs : faces opposées appariées (somme constante, comme sur de vrais dés)
function faceLabels(type, faces) {
  const n = faces.length;
  let list;
  if (type === 'd10') list = [...Array(10).keys()].map(v => ({ value: v === 0 ? 10 : v, text: String(v) }));
  else if (type === 'd100') list = [...Array(10).keys()].map(v => ({ value: v * 10, text: v === 0 ? '00' : String(v * 10) }));
  else list = [...Array(n).keys()].map(v => ({ value: v + 1, text: String(v + 1) }));
  if (type === 'd10') list.sort((a, b) => (a.text - b.text)); // 0..9

  const out = new Array(n);
  let j = 0;
  for (let i = 0; i < n; i++) {
    if (out[i]) continue;
    const opp = faces.findIndex((f, k) => k !== i && !out[k] && f.normal.dot(faces[i].normal) < -0.99);
    out[i] = list[j];
    if (opp >= 0) out[opp] = list[n - 1 - j];
    j++;
  }
  return out;
}

/* ---------- Chiffres gravés ---------- */
// Masque (forme du chiffre), carte de normales (parois du creux, éclairées par la vraie lumière)
// et occlusion (le fond du creux reçoit moins de lumière ambiante près des parois).
// La couleur vient du matériau : couleur des chiffres × texture de la matière.
const texCache = new Map();
function labelTextures(text) {
  if (texCache.has(text)) return texCache.get(text);
  const S = 256;
  const mask = document.createElement('canvas'); mask.width = mask.height = S;
  const mg = mask.getContext('2d');
  const size = text.length > 1 ? 120 : 150;
  mg.fillStyle = '#000'; mg.fillRect(0, 0, S, S);
  mg.fillStyle = '#fff';
  mg.font = `800 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  mg.textAlign = 'center'; mg.textBaseline = 'middle';
  mg.fillText(text, S / 2, S / 2 + size * 0.04);
  if (text === '6' || text === '9') mg.fillRect(S / 2 - 34, S / 2 + size * 0.42, 68, 12);  // repère 6/9

  const px = mg.getImageData(0, 0, S, S).data;
  const m = new Float32Array(S * S);
  for (let i = 0; i < S * S; i++) m[i] = px[i * 4] / 255;

  // relief : hauteur = 1 dehors, 0 au fond du creux, parois en pente douce
  let h = m.map(v => 1 - v);
  for (let pass = 0; pass < 2; pass++) h = boxBlur(h, S, 2);
  // occlusion : plus sombre près des parois
  let o = m.slice();
  for (let pass = 0; pass < 2; pass++) o = boxBlur(o, S, 5);

  const toCanvas = fill => {
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), img = g.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) fill(img.data, (y * S + x) * 4, x, y);
    g.putImageData(img, 0, 0);
    return new THREE.CanvasTexture(c);
  };
  const at = (x, y) => h[Math.min(S - 1, Math.max(0, y)) * S + Math.min(S - 1, Math.max(0, x))];
  const normalMap = toCanvas((d, i, x, y) => {
    let nx = -(at(x + 1, y) - at(x - 1, y)) * 9, ny = (at(x, y + 1) - at(x, y - 1)) * 9, nz = 1;
    const l = Math.hypot(nx, ny, nz);
    d[i] = (nx / l * .5 + .5) * 255; d[i + 1] = (ny / l * .5 + .5) * 255; d[i + 2] = (nz / l * .5 + .5) * 255; d[i + 3] = 255;
  });
  const ao = toCanvas((d, i, x, y) => {
    const v = 255 * Math.min(1, 0.3 + 0.75 * o[y * S + x]);
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  });
  const alpha = new THREE.CanvasTexture(mask);
  for (const t of [normalMap, ao, alpha]) t.anisotropy = 4;
  const out = { alpha, normalMap, ao };
  texCache.set(text, out);
  return out;
}

function boxBlur(src, S, r) {
  const tmp = new Float32Array(S * S), dst = new Float32Array(S * S), n = 2 * r + 1;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let sum = 0; for (let k = -r; k <= r; k++) sum += src[y * S + Math.min(S - 1, Math.max(0, x + k))];
    tmp[y * S + x] = sum / n;
  }
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let sum = 0; for (let k = -r; k <= r; k++) sum += tmp[Math.min(S - 1, Math.max(0, y + k)) * S + x];
    dst[y * S + x] = sum / n;
  }
  return dst;
}

/* ---------- Matières (textures procédurales) ---------- */
// Chaque matière = une carte de couleur en niveaux de gris (teintée par la couleur du dé)
// + une carte « données » linéaire : R = relief (bumpMap), G = rugosité, B = métal
// (+ une normalMap pour les paillettes). Rugosité/métal absolus dans la carte : le
// matériau du corps utilise roughness = metalness = 1 ; `roughness` ci-dessous sert aux chiffres.
// labelMap : le fond des chiffres montre la matière (gravure à nu, métal) au lieu d'une peinture unie.
const STYLES = {
  marbre: { name: 'Marbre', pattern: 'marble', roughness: 0.18, clearcoat: 1, ccRough: 0.03 },
  bois:   { name: 'Bois',   pattern: 'wood',  bump: 0.5, roughness: 0.55, clearcoat: 0.35, ccRough: 0.32, tint: ['#a8743f', 0.55] },
  pierre: { name: 'Pierre', pattern: 'stone', bump: 0.5, roughness: 0.5, clearcoat: 0.15, ccRough: 0.25, tint: ['#9a958c', 0.45] },
  metal:  { name: 'Métal',  pattern: 'metal', bump: 0.5, roughness: 0.4, metalness: 1, envIntensity: 2.6, anisotropy: 0.55, tint: ['#c8ccd2', 0.35], labelMap: true },
  resine: { name: 'Résine', pattern: 'resin', bump: 0.25, roughness: 0.3, clearcoat: 0.45, ccRough: 0.1 },
  verre:  { name: 'Verre', glass: true, roughness: 0.03, transmission: 0.9, thickness: 0.8, attDist: 1.2, whiten: 0.4 },
  paillettes: { name: 'Paillettes', glass: true, pattern: 'sparkle', roughness: 0.2, transmission: 0.8, thickness: 0.8, attDist: 1.0, whiten: 0.3, sparkle: true },
};
let styleKey = 'marbre';
try { const v = localStorage.getItem('dice-style'); if (STYLES[v]) styleKey = v; } catch (_) {}

function hash2(x, y, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
// Bruit de valeur sur une table 256×256 précalculée (bien plus rapide que de hacher chaque coin)
const NOISE_T = (() => { const t = new Float32Array(65536); for (let i = 0; i < 65536; i++) t[i] = hash2(i & 255, i >> 8, 7); return t; })();
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let xf = x - xi, yf = y - yi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const x0 = (xi + s * 157) & 255, x1 = (x0 + 1) & 255, y0 = ((yi + s * 89) & 255) << 8, y1 = (y0 + 256) & 65280;
  const a = NOISE_T[y0 + x0], b = NOISE_T[y0 + x1], c = NOISE_T[y1 + x0], d = NOISE_T[y1 + x1];
  return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
}
function fbm(x, y, oct, s) {
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { v += amp * vnoise(x * f, y * f, s + i); norm += amp; f *= 2; amp *= 0.5; }
  return v / norm;
}
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// Génère (une fois, en cache) les cartes d'une matière
const patternCache = {};
function patternMaps(kind) {
  if (patternCache[kind]) return patternCache[kind];
  const S = 512, N = S * S;
  const col = new Float32Array(N).fill(1), hgt = new Float32Array(N).fill(0.5);
  const rgh = new Float32Array(N).fill(0.5), mtl = new Float32Array(N);
  let nrm = null;           // normales de paillettes (x, y) ou null
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
  const cCol = mk(), cDat = mk();
  let strokes = null;       // rayures dessinées après coup (métal, résine)

  if (kind === 'marble') {
    // Veines qui « coulent » dans une direction (sinus perturbé par turbulence),
    // réseau de fines veines secondaires, et une copie large et pâle des veines
    // qui simule leur prolongement sous la surface, vu à travers le vernis.
    for (let y = 0, i = 0; y < S; y++) for (let x = 0; x < S; x++, i++) {
      const u = x / S, v = y / S;
      const wx = u + 0.22 * fbm(u * 3, v * 3, 3, 1), wy = v + 0.22 * fbm(u * 3 + 5.2, v * 3 + 1.3, 3, 2);
      const t = fbm(wx * 4, wy * 4, 4, 3);
      const s1 = 1 - Math.abs(Math.sin((wx * 1.3 + wy * 0.8) * 13 + t * 8));
      const r2 = 1 - Math.abs(2 * fbm(wx * 12 + 3.1, wy * 12, 3, 11) - 1);
      const cloud = 0.6 * vnoise(u * 5, v * 5, 17) + 0.4 * vnoise(u * 11, v * 11, 18);
      const vein = Math.pow(s1, 26) * (0.55 + 0.45 * smooth(0.3, 0.6, t));
      const deep = Math.pow(s1, 4), thin = Math.pow(r2, 40) * smooth(0.35, 0.7, cloud);
      const milk = smooth(0.4, 0.75, t);                      // nuages laiteux plus clairs
      col[i] = 0.9 + 0.1 * milk - 0.07 * cloud - 0.2 * deep - 0.5 * vein - 0.3 * thin;
      rgh[i] = 0.14 + 0.1 * vein + 0.06 * thin + 0.05 * cloud;
      hgt[i] = 0.5 - 0.2 * vein;
    }
  } else if (kind === 'wood') {
    // Cernes en arcs (débit sur dosse) : bois de printemps clair et poreux, bois d'été
    // sombre et dense qui finit net ; fibres, pores allongés, rayons médullaires.
    for (let y = 0, i = 0; y < S; y++) for (let x = 0; x < S; x++, i++) {
      const u = x / S, v = y / S;
      const warp = fbm(u * 2.5, v * 4, 3, 3) - 0.5;
      // plan de coupe légèrement incliné par rapport au tronc : arcs « en cathédrale »
      const dist = Math.hypot(v - 0.5 + 0.06 * warp, 0.1 + 0.22 * u);
      const rp = dist * 34 + warp * 1.2 + 0.12 * (vnoise(u * 2, v * 30, 5) - 0.5);
      const ri = Math.floor(rp), f = rp - ri;

      const pore = smooth(0.8, 0.9, vnoise(u * 80, v * 420, 19)) * (1 - smooth(0.1, 0.35, f)) * (0.5 + 0.5 * rw);
      const ray = smooth(0.88, 0.95, vnoise(u * 24, v * 300, 23));

      hgt[i] = 0.5 - 0.45 * pore + 0.1 * fiber;
    }

    // et mica noir, parsemés de gros cristaux de feldspath ; joints un peu creux et plus mats.
    let d1, d2, id;
    const voro = (px, py, s) => {
      const cx = Math.floor(px), cy = Math.floor(py);
      d1 = d2 = 9; id = 0;
      for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
        const gx = cx + k, gy = cy + j;
        const dx = gx + hash2(gx, gy, s) - px, dy = gy + hash2(gx, gy, s + 1) - py, d = dx * dx + dy * dy;
        if (d < d1) { d2 = d1; d1 = d; id = gx * 7919 + gy; } else if (d < d2) d2 = d;

      return smooth(0, 0.1, Math.sqrt(d2) - Math.sqrt(d1));
    };
    for (let y = 0, i = 0; y < S; y++) for (let x = 0; x < S; x++, i++) {
      const u = x / S, v = y / S;
      const wu = u + 0.035 * (fbm(u * 5, v * 5, 2, 5) - 0.5) + 0.008 * (vnoise(u * 60, v * 60, 7) - 0.5);
      const wv = v + 0.035 * (fbm(u * 5 + 9, v * 5, 2, 6) - 0.5) + 0.008 * (vnoise(u * 60 + 3, v * 60, 8) - 0.5);

  } else if (kind === 'sparkle') {

    // les fait scintiller seulement sous le bon angle ; presque opaques et métalliques.
    // Ici la carte « couleur » sert de masque (émission très faible des paillettes).
    nrm = new Float32Array(N * 2);

    hgt.fill(1);              // R = transmission (1 = verre, 0 = paillette)
    rgh.fill(0.06);
    const C = 7, n = Math.ceil(S / C);
    for (let gy = 0; gy < n; gy++) for (let gx = 0; gx < n; gx++) {

      const fx = (gx + 0.2 + 0.6 * hash2(gx, gy, 52)) * C, fy = (gy + 0.2 + 0.6 * hash2(gx, gy, 53)) * C;
      const rad = 1.1 + 1.4 * hash2(gx, gy, 54), ang = 6.283 * hash2(gx, gy, 55);
      const tilt = 0.8 * Math.sqrt(hash2(gx, gy, 56)), az = 6.283 * hash2(gx, gy, 57);
      const nx = Math.sin(tilt) * Math.cos(az), ny = Math.sin(tilt) * Math.sin(az);
      const ca = Math.cos(ang), sa = Math.sin(ang), bright = 0.5 + 0.5 * hash2(gx, gy, 58);

        if (x < 0 || y < 0 || x >= S || y >= S) continue;
        const dx = x + 0.5 - fx, dy = y + 0.5 - fy;

        hgt[i] = 0.2; rgh[i] = 0.14; mtl[i] = 0.85; col[i] = bright;

  }

  // Écriture des canvas
  const gc = cCol.getContext('2d'), gd = cDat.getContext('2d');
  const ic = gc.createImageData(S, S), id = gd.createImageData(S, S);
  const dc = ic.data, dd = id.data;
  for (let i = 0, o = 0; i < N; i++, o += 4) {
    const b = clamp01(col[i]) * 255;
    dc[o] = dc[o + 1] = dc[o + 2] = b; dc[o + 3] = 255;
    dd[o] = clamp01(hgt[i]) * 255; dd[o + 1] = clamp01(rgh[i]) * 255; dd[o + 2] = mtl[i] * 255; dd[o + 3] = 255;
  }
  gc.putImageData(ic, 0, 0); gd.putImageData(id, 0, 0);
  if (strokes) {
    // Micro-rayures : courtes lignes courbes, surtout dans le sens du brossage
    let seed = 0;
    const rnd = () => hash2(seed++, 77, 99);
    gc.lineCap = gd.lineCap = 'round';
    for (let k = 0; k < strokes.n; k++) {
      const x0 = rnd() * S, y0 = rnd() * S, len = 15 + 110 * rnd() * rnd();
      const a = rnd() < strokes.along ? (rnd() - 0.5) * 0.35 : rnd() * 6.28;
      const x1 = x0 + Math.cos(a) * len, y1 = y0 + Math.sin(a) * len;
      const bx = (x0 + x1) / 2 + (rnd() - 0.5) * len * 0.2, by = (y0 + y1) / 2 + (rnd() - 0.5) * len * 0.2;

  map.colorSpace = THREE.SRGBColorSpace;

  let normalMap = null;

    const cN = mk(), gn = cN.getContext('2d'), inn = gn.createImageData(S, S), dn = inn.data;
    for (let i = 0, o = 0; i < N; i++, o += 4) {
      const nx = nrm[2 * i], ny = nrm[2 * i + 1], nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));

    }
    gn.putImageData(inn, 0, 0);

    normalMap.minFilter = THREE.LinearMipmapNearestFilter;

  return (patternCache[kind] = { map, data, normalMap });
}
function patternTexture(kind) { return patternMaps(kind).map; }

function bodyColor(type) {
  const st = STYLES[styleKey];
  const color = new THREE.Color(TYPES[type].color);
  if (st.tint) color.lerp(new THREE.Color(st.tint[0]), st.tint[1]);
  return color;
}

// Texture de matière lue via uv1 (coordonnées de la face) pour les chiffres
const patternUV1 = {};
function patternTexture1(kind) {
  if (!patternUV1[kind]) { const t = patternTexture(kind).clone(); t.channel = 1; t.needsUpdate = true; patternUV1[kind] = t; }
  return patternUV1[kind];
}

function labelMaterial(type, text) {
  const st = STYLES[styleKey], t = labelTextures(text);
  return new THREE.MeshPhysicalMaterial({
    color: TYPES[type].ink,
    map: st.labelMap ? patternTexture1(st.pattern) : null,
    alphaMap: t.alpha, transparent: true,
    normalMap: t.normalMap, normalScale: new THREE.Vector2(1.5, 1.5),
    aoMap: t.ao, aoMapIntensity: 1,
    // peinture du fond de gravure : un peu plus mate que le corps (sauf sur le métal, laissé nu)
    roughness: Math.min(1, (st.roughness ?? 0.4) + 0.15), metalness: st.metalness || 0,

}
function refreshLabels(d) {
  for (const plane of d.mesh.children) { plane.material.dispose(); plane.material = labelMaterial(d.type, plane.userData.text); }
}

function dieMaterial(type) {
  const st = STYLES[styleKey];
  if (st.glass) {
    // Verre / résine translucide : la lumière traverse le dé et se teinte avec l'épaisseur
    const base = new THREE.Color(TYPES[type].color), white = new THREE.Color('#ffffff');
    const m = new THREE.MeshPhysicalMaterial({
      color: base.clone().lerp(white, st.whiten),
      transmission: st.transmission, thickness: st.thickness, ior: 1.5,
      attenuationColor: base, attenuationDistance: st.attDist,
      roughness: st.roughness, metalness: 0,
      clearcoat: 1, clearcoatRoughness: 0.03, specularIntensity: 1,
    });
    if (st.sparkle) {
      // Paillettes réfléchissantes sous un vernis lisse : elles s'allument selon l'angle
      const P = patternMaps(st.pattern);
      Object.assign(m, {
        normalMap: P.normalMap, normalScale: new THREE.Vector2(1, 1),
        roughness: 1, roughnessMap: P.data, metalness: 1, metalnessMap: P.data,
        transmissionMap: P.data,
        emissive: base.clone().lerp(white, 0.5), emissiveMap: P.map, emissiveIntensity: 0.35,

    }

  }

  const P = st.pattern ? patternMaps(st.pattern) : null;
  return new THREE.MeshPhysicalMaterial({
    color, map: P ? P.map : null,
    bumpMap: P && st.bump ? P.data : null, bumpScale: st.bump || 0,
    roughness: P ? 1 : st.roughness, roughnessMap: P ? P.data : null,
    metalness: P ? 1 : (st.metalness || 0), metalnessMap: P ? P.data : null,
    clearcoat: st.clearcoat || 0, clearcoatRoughness: st.ccRough ?? 0.12,
    // métal brossé : les stries suivent u, le reflet s'étire en travers (le long de la bitangente)

/* ---------- Gabarits (géométrie + physique), mis en cache par type ---------- */
const templates = {};
function templateFor(type) {
  if (templates[type]) return templates[type];
  const { verts, faces } = shapeFor(type);
  // d4 : la valeur est portée par chaque sommet (lu sur le sommet du haut)
  const vertexValues = type === 'd4' ? verts.map((_, i) => ({ value: i + 1, text: String(i + 1) })) : null;
  const labels = type === 'd4' ? null : faceLabels(type, faces);

  // Géométrie de rendu (facettes planes)
  // --- Géométrie arrondie : faces rentrées + bandes d'arête + coins ---
  // Les normales passent en douceur d'une face à l'autre sur les bandes : l'arête paraît arrondie
  // et accroche la lumière. La physique garde le polyèdre exact.
  const B = 0.06 * TYPES[type].radius;
  const frac = x => x - Math.floor(x);
  const faceUV = faces.map((f, fi) => {
    // chaque face « découpe » un morceau différent de la matière
    const u = verts[f.ids[0]].clone().sub(f.center).normalize();
    return {
      u, w: new THREE.Vector3().crossVectors(f.normal, u),
      ou: 0.3 + 0.4 * frac(Math.sin(fi * 12.9898 + 1) * 43758.5453),
      ow: 0.3 + 0.4 * frac(Math.sin(fi * 78.233 + 2) * 43758.5453),
    };
  });
  const uvOf = (fi, p) => {
    const F = faceUV[fi], d = p.clone().sub(faces[fi].center);
    return [F.ou + d.dot(F.u) * 0.22, F.ow + d.dot(F.w) * 0.22];
  };
  // coin de chaque face, rentré de B vers l'intérieur de la face
  const inset = faces.map(f => {
    const m = new Map(), n = f.ids.length;
    f.ids.forEach((id, k) => {
      const v = verts[id];
      const e1 = verts[f.ids[(k + n - 1) % n]].clone().sub(v).normalize();
      const e2 = verts[f.ids[(k + 1) % n]].clone().sub(v).normalize();
      const bis = e1.clone().add(e2).normalize();
      m.set(id, v.clone().addScaledVector(bis, B / Math.sin(e1.angleTo(e2) / 2)));
    });
    return m;
  });

  const pos = [], nor = [], uv = [];
  const tri = (A, Bv, C) => {           // sommets = [position, normale, uv]
    const cr = Bv[0].clone().sub(A[0]).cross(C[0].clone().sub(A[0]));
    if (cr.dot(A[0].clone().add(Bv[0]).add(C[0])) < 0) [Bv, C] = [C, Bv];   // toujours vers l'extérieur
    for (const [p, n, t] of [A, Bv, C]) { pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); uv.push(t[0], t[1]); }
  };
  const V = (fi, id) => { const p = inset[fi].get(id); return [p, faces[fi].normal, uvOf(fi, p)]; };

  // faces
  faces.forEach((f, fi) => {
    for (let i = 1; i < f.ids.length - 1; i++) tri(V(fi, f.ids[0]), V(fi, f.ids[i]), V(fi, f.ids[i + 1]));
  });
  // bandes d'arête
  const edges = new Map();
  faces.forEach((f, fi) => f.ids.forEach((a, k) => {
    const b = f.ids[(k + 1) % f.ids.length], key = Math.min(a, b) + '_' + Math.max(a, b);
    if (!edges.has(key)) edges.set(key, { a, b, fs: [] });
    edges.get(key).fs.push(fi);
  }));
  for (const { a, b, fs: [F, G] } of edges.values()) {
    tri(V(F, a), V(F, b), V(G, b));
    tri(V(F, a), V(G, b), V(G, a));
  }
  // coins : petit éventail bombé
  verts.forEach((v, id) => {
    const inc = faces.map((_, fi) => fi).filter(fi => faces[fi].ids.includes(id));
    const nV = v.clone().normalize();
    const ref = inset[inc[0]].get(id).clone().sub(v), w2 = nV.clone().cross(ref);
    const ang = fi => { const d = inset[fi].get(id).clone().sub(v); return Math.atan2(d.dot(w2), d.dot(ref)); };
    inc.sort((i, j) => ang(i) - ang(j));
    const c = new THREE.Vector3();
    inc.forEach(fi => c.add(inset[fi].get(id)));
    c.divideScalar(inc.length).addScaledVector(nV, B * 0.35);
    const C = [c, nV, uvOf(inc[0], c)];
    for (let k = 0; k < inc.length; k++) tri(C, V(inc[k], id), V(inc[(k + 1) % inc.length], id));
  });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

  // Placement des étiquettes
  const labelInfo = [];
  faces.forEach((f, i) => {
    // rayon inscrit approx. = distance mini du centre aux arêtes
    let inr = Infinity;
    for (let k = 0; k < f.ids.length; k++) {
      const a = verts[f.ids[k]], b = verts[f.ids[(k + 1) % f.ids.length]];
      const ab = b.clone().sub(a), t = THREE.MathUtils.clamp(f.center.clone().sub(a).dot(ab) / ab.lengthSq(), 0, 1);
      inr = Math.min(inr, a.clone().addScaledVector(ab, t).distanceTo(f.center));
    }
    let up;
    if (type === 'd6') up = verts[f.ids[0]].clone().add(verts[f.ids[1]]).multiplyScalar(.5).sub(f.center);
    else {
      let far = f.ids[0], best = -1;
      for (const id of f.ids) { const d = verts[id].distanceTo(f.center); if (d > best + 1e-6) { best = d; far = id; } }
      up = verts[far].clone().sub(f.center);
    }
    if (type === 'd4') {
      // un chiffre près de chaque coin, tourné vers ce coin
      for (const id of f.ids) {
        const dir = verts[id].clone().sub(f.center);
        labelInfo.push({ ...vertexValues[id], fi: i, normal: f.normal, up: dir.clone().normalize(),
          center: f.center.clone().addScaledVector(dir, 0.52), size: 2 * inr * 0.85 });
      }
      return;
    }
    up.normalize();
    const scale = { d6: 1.3, d8: 1.5, d10: 1.45, d12: 1.4, d20: 1.35, d100: 1.6 }[type];
    labelInfo.push({ ...labels[i], fi: i, normal: f.normal, center: f.center, up, size: 2 * inr * scale });
  });
  // Plan de chaque chiffre : uv = forme du chiffre, uv1 = même matière que la face en dessous
  for (const L of labelInfo) {
    const g = new THREE.PlaneGeometry(L.size, L.size);
    const X = new THREE.Vector3().crossVectors(L.up, L.normal);
    const pa = g.attributes.position, uv1 = [];
    for (let k = 0; k < pa.count; k++) {
      const p = L.center.clone().addScaledVector(X, pa.getX(k)).addScaledVector(L.up, pa.getY(k));
      uv1.push(...uvOf(L.fi, p));
    }
    g.setAttribute('uv1', new THREE.Float32BufferAttribute(uv1, 2));
    L.geo = g;
  }
  // Ce qui sert à lire le résultat : normale de face, ou direction du sommet pour le d4
  const readInfo = type === 'd4'
    ? verts.map((v, i) => ({ ...vertexValues[i], normal: v.clone().normalize() }))
    : labelInfo;

  const shape = new CANNON.ConvexPolyhedron({
    vertices: verts.map(v => new CANNON.Vec3(v.x, v.y, v.z)),
    faces: faces.map(f => f.ids),
  });

  return (templates[type] = { geo, labelInfo, readInfo, shape });
}

sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun);

const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: '#1f7a44', map: makeFeltTexture(), roughness: 1 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

/* ---------- Physique ---------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -40, 0) });
world.allowSleep = true;
world.broadphase = new CANNON.SAPBroadphase(world);

const diceMat = new CANNON.Material('dice');
const tableMat = new CANNON.Material('table');
world.addContactMaterial(new CANNON.ContactMaterial(diceMat, tableMat, { friction: 0.35, restitution: 0.3 }));
world.addContactMaterial(new CANNON.ContactMaterial(diceMat, diceMat, { friction: 0.2, restitution: 0.35 }));

function addPlane(euler) {
  const b = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: tableMat });
  b.quaternion.setFromEuler(...euler);
  world.addBody(b);
  return b;
}
addPlane([-Math.PI / 2, 0, 0]);                         // sol
const wallLeft  = addPlane([0, Math.PI / 2, 0]);
const wallRight = addPlane([0, -Math.PI / 2, 0]);
const wallBack  = addPlane([0, 0, 0]);
const wallFront = addPlane([0, Math.PI, 0]);
addPlane([Math.PI / 2, 0, 0]).position.y = 14;          // plafond

const arena = { xMin: -4, xMax: 4, zMin: -4, zMax: 4 };

/* =========================================================
   Dés
   ========================================================= */
const dice = [];   // { type, mesh, body, labelInfo, value, rolling, rollStart }

function createDie(type) {
  const tpl = templateFor(type);
  const conf = TYPES[type];
  const mesh = new THREE.Mesh(tpl.geo, dieMaterial(type));
  mesh.castShadow = true;

  const q = new THREE.Quaternion(), m = new THREE.Matrix4();
  for (const L of tpl.labelInfo) {
    const plane = new THREE.Mesh(L.geo, labelMaterial(type, L.text));
    const x = new THREE.Vector3().crossVectors(L.up, L.normal);
    m.makeBasis(x, L.up, L.normal);
    q.setFromRotationMatrix(m);
    plane.quaternion.copy(q);
    plane.position.copy(L.center).addScaledVector(L.normal, 0.003);
    plane.userData.text = L.text;
    mesh.add(plane);
  }
  scene.add(mesh);

  const body = new CANNON.Body({
    mass: 1, material: diceMat, shape: tpl.shape,
    allowSleep: false,   // l'arrêt est détecté par la page (dé à plat et immobile)
    linearDamping: 0.1, angularDamping: { d10: 0.25, d12: 0.35, d20: 0.35, d100: 0.25 }[type] ?? 0.12,
  });
  world.addBody(body);
  const die = { type, mesh, body, labelInfo: tpl.readInfo, value: null, text: '', rolling: false, rollStart: 0 };
  mesh.userData.die = die;
  body.addEventListener('collide', e => {
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    if (v > 2) clack(v);
  });
  return die;
}

function removeDie(d) {
  scene.remove(d.mesh);
  d.mesh.children.forEach(c => c.material.dispose());   // géométries partagées par type
  d.mesh.material.dispose();
  world.removeBody(d.body);
  dice.splice(dice.indexOf(d), 1);
}

function syncDice() {
  for (const type of Object.keys(TYPES)) {
    const mine = dice.filter(d => d.type === type);
    for (let i = mine.length; i < counts[type]; i++) dice.push(createDie(type));
    for (let i = mine.length; i > counts[type]; i--) removeDie(mine[i - 1]);
  }
  dice.sort((a, b) => Object.keys(TYPES).indexOf(a.type) - Object.keys(TYPES).indexOf(b.type));
  renderTray();
}

function rand(a, b) { return a + Math.random() * (b - a); }

function rollDie(d, strength = 1) {
  const b = d.body;
  b.wakeUp();
  const cx = (arena.xMin + arena.xMax) / 2, cz = (arena.zMin + arena.zMax) / 2;
  const mx = Math.max(0.5, (arena.xMax - arena.xMin) / 2 - 1.2), mz = Math.max(0.5, (arena.zMax - arena.zMin) / 2 - 1.2);
  b.position.set(cx + rand(-mx, mx), rand(3, 7), cz + rand(-mz, mz));
  b.quaternion.setFromEuler(rand(0, 6.28), rand(0, 6.28), rand(0, 6.28));
  const dir = new CANNON.Vec3(cx - b.position.x + rand(-1.5, 1.5), 0, cz - b.position.z + rand(-1.5, 1.5));
  dir.normalize();
  const speed = rand(7, 13) * strength;
  b.velocity.set(dir.x * speed, rand(-2, 4), dir.z * speed);
  b.angularVelocity.set(rand(-25, 25), rand(-25, 25), rand(-25, 25));
  d.value = null;
  d.rolling = true;
  d.calm = 0;
  d.rollStart = simTime;
}

function rollAll(strength = 1) {
  if (!dice.length) return;
  hideHint();
  dice.forEach(d => rollDie(d, strength));
  if (navigator.vibrate) navigator.vibrate(30);
  updateResult();
}

const _q = new THREE.Quaternion(), _n = new THREE.Vector3();
function readFace(d) {
  _q.copy(d.body.quaternion);
  let best = -Infinity, pick = d.labelInfo[0];
  for (const L of d.labelInfo) {
    const y = _n.copy(L.normal).applyQuaternion(_q).y;
    if (y > best) { best = y; pick = L; }
  }
  return pick;
}

// Dans quelle mesure la face lue est bien tournée vers le haut (1 = parfaitement à plat)
function topAlignment(d) {
  _q.copy(d.body.quaternion);
  let best = -Infinity;
  for (const L of d.labelInfo) best = Math.max(best, _n.copy(L.normal).applyQuaternion(_q).y);
  return best;
}

function updateResult() {
  const el = document.getElementById('result');
  if (!dice.length) { el.textContent = 'Ajoutez des dés avec les boutons du bas'; return; }
  if (dice.some(d => d.rolling)) { el.textContent = 'Lancer en cours…'; return; }
  if (dice.some(d => d.value == null)) { el.textContent = 'Touchez un dé ou secouez le téléphone'; return; }

  const total = dice.reduce((s, d) => s + d.value, 0);
  const chips = dice.map(d => {
    const c = TYPES[d.type];
    return `<span class="v" style="background:${c.color};color:${c.ink}">${d.text}<small> ${d.type}</small></span>`;
  }).join(' ');
  let extra = '';
  // d100 + d10 = jet de pourcentage (00 + 10 → 100)
  const p = dice.filter(d => d.type === 'd100'), t = dice.filter(d => d.type === 'd10');
  if (p.length === 1 && t.length === 1) {
    const pct = (p[0].value + (t[0].value % 10)) || 100;
    extra = `<br>Pourcentage (d100 + d10) : <b class="total">${pct}</b>`;
  }
  el.innerHTML = dice.length === 1
    ? `${chips} <b class="total">${total}</b>${extra}`
    : `${chips} = <b class="total">${total}</b>${extra}`;
}

/* ---------- Plateau de sélection ---------- */
const tray = document.getElementById('tray');
function renderTray() {
  tray.innerHTML = '';
  for (const type of Object.keys(TYPES)) {
    const b = document.createElement('button');
    b.className = 'chip' + (counts[type] ? ' on' : '');
    b.style.setProperty('--c', TYPES[type].color);
    b.innerHTML = `${type}<span class="badge">${counts[type]}</span>`;
    b.addEventListener('click', e => {
      askMotionPermission();
      const total = Object.values(counts).reduce((a, c) => a + c, 0);
      if (e.target.classList.contains('badge')) counts[type] = Math.max(0, counts[type] - 1);
      else if (total < MAX_DICE) counts[type]++;
      else return;
      syncDice();
      rollAll();
      updateResult();
    });
    tray.appendChild(b);
  }
}

/* ---------- Arène adaptée à l'écran ---------- */
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function floorPoint(nx, ny) {
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const p = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, p);
  return p;
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = THREE.MathUtils.clamp(5.2 / (t * Math.min(1, camera.aspect)), 11, 45);
  camera.position.set(0, dist * 0.94, dist * 0.34);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();

  const topPx = document.querySelector('.top').offsetHeight + 10;
  const botPx = document.querySelector('.bottom').offsetHeight + 10;
  const topY = 1 - 2 * topPx / h, botY = -1 + 2 * botPx / h;
  const bl = floorPoint(-1, botY), br = floorPoint(1, botY), tl = floorPoint(-1, topY);
  const m = 0.15;
  arena.xMin = bl.x + m; arena.xMax = br.x - m;
  arena.zMin = tl.z + m; arena.zMax = Math.max(bl.z - m, arena.zMin + 4);

  wallLeft.position.set(arena.xMin, 0, 0);
  wallRight.position.set(arena.xMax, 0, 0);
  wallBack.position.set(0, 0, arena.zMin);
  wallFront.position.set(0, 0, arena.zMax);

  const s = Math.max(arena.xMax - arena.xMin, arena.zMax - arena.zMin);
  const sc = sun.shadow.camera;
  sc.left = -s; sc.right = s; sc.top = s; sc.bottom = -s; sc.near = 1; sc.far = 60;
  sc.updateProjectionMatrix();

  dice.forEach(d => {
    const p = d.body.position;
    if (p.x < arena.xMin || p.x > arena.xMax || p.z < arena.zMin || p.z > arena.zMax) {
      p.set(rand(arena.xMin + 1, arena.xMax - 1), 2, rand(arena.zMin + 1, arena.zMax - 1));
      d.body.wakeUp();
    }
  });
}
window.addEventListener('resize', resize);

/* ---------- Clic / toucher ---------- */
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', e => {
  askMotionPermission();
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(dice.map(d => d.mesh), true)[0];
  if (hit) {
    let o = hit.object;
    while (o && !o.userData.die) o = o.parent;
    hideHint();
    rollDie(o.userData.die);
    if (navigator.vibrate) navigator.vibrate(20);
    updateResult();
  } else {
    rollAll();
  }
});

document.getElementById('rollBtn').addEventListener('click', () => { askMotionPermission(); rollAll(); });
/* ---------- Couleurs personnalisées ---------- */
const colorSheet = document.getElementById('colorSheet');
const colorRows = document.getElementById('colorRows');

function saveColors() {
  const out = {};
  for (const k in TYPES) out[k] = { color: TYPES[k].color, ink: TYPES[k].ink };
  try { localStorage.setItem('dice-colors', JSON.stringify(out)); } catch (_) {}
}
function refreshBody(type) {
  for (const d of dice) if (d.type === type) { d.mesh.material.dispose(); d.mesh.material = dieMaterial(type); }
}
function refreshInk(type) {
  for (const d of dice) if (d.type === type) {
    for (const plane of d.mesh.children) plane.material.color.set(TYPES[type].ink);
  }
}
function buildColorRows() {
  colorRows.innerHTML = '';
  for (const type of Object.keys(TYPES)) {
    const row = document.createElement('div');
    row.className = 'crow';
    row.innerHTML = `<b>${type}</b>
      <label>Corps <input type="color" id="body-${type}" value="${TYPES[type].color}"></label>
      <label>Chiffres <input type="color" id="ink-${type}" value="${TYPES[type].ink}"></label>`;
    const body = row.querySelector('#body-' + type), ink = row.querySelector('#ink-' + type);
    // corps : mise à jour en direct (peu coûteux)
    body.addEventListener('input', () => { TYPES[type].color = body.value; refreshBody(type); });
    body.addEventListener('change', () => { saveColors(); renderTray(); updateResult(); });
    // chiffres : regénère les textures gravées à la validation
    const applyInk = () => {
      if (TYPES[type].ink === ink.value) return;
      TYPES[type].ink = ink.value; refreshInk(type); saveColors(); updateResult();
    };
    ink.addEventListener('change', applyInk);
    ink.addEventListener('blur', applyInk);
    colorRows.appendChild(row);
  }
}
document.getElementById('colorBtn').addEventListener('click', () => { buildColorRows(); colorSheet.hidden = false; });
document.getElementById('colorClose').addEventListener('click', () => { colorSheet.hidden = true; });
document.getElementById('colorReset').addEventListener('click', () => {
  for (const k in TYPES) {
    const inkChanged = TYPES[k].ink !== DEFAULT_COLORS[k].ink;
    Object.assign(TYPES[k], DEFAULT_COLORS[k]);
    refreshBody(k);
    if (inkChanged) refreshInk(k);
  }
  saveColors(); buildColorRows(); renderTray(); updateResult();
});

const styleBtn = document.getElementById('styleBtn');
function applyStyle() {
  styleBtn.textContent = 'Matière : ' + STYLES[styleKey].name;
  for (const d of dice) { d.mesh.material.dispose(); d.mesh.material = dieMaterial(d.type); refreshLabels(d); }
  try { localStorage.setItem('dice-style', styleKey); } catch (_) {}
}
styleBtn.addEventListener('click', () => {
  const keys = Object.keys(STYLES);
  styleKey = keys[(keys.indexOf(styleKey) + 1) % keys.length];
  applyStyle();
});
applyStyle();

document.getElementById('clearBtn').addEventListener('click', () => {
  Object.keys(counts).forEach(k => counts[k] = 0);
  syncDice(); updateResult();
});
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); rollAll(); } });

function hideHint() { document.getElementById('hint').classList.add('gone'); }

/* ---------- Secousse du téléphone ---------- */
const shakeBtn = document.getElementById('shakeBtn');
let motionOn = false, lastShake = 0, last = null;
const needsPermission = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';

function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  if (last) {
    const delta = Math.abs(a.x - last.x) + Math.abs(a.y - last.y) + Math.abs(a.z - last.z);
    const now = performance.now();
    if (delta > 22 && now - lastShake > 700) {
      lastShake = now;
      rollAll(Math.min(1.6, delta / 25));
    }
  }
  last = { x: a.x, y: a.y, z: a.z };
}
function enableMotion() {
  if (motionOn) return;
  motionOn = true;
  window.addEventListener('devicemotion', onMotion);
  shakeBtn.hidden = true;
}
function askMotionPermission() {
  if (motionOn || !needsPermission) return;
  DeviceMotionEvent.requestPermission()
    .then(s => { if (s === 'granted') enableMotion(); })
    .catch(() => {});
}
if (typeof DeviceMotionEvent !== 'undefined') {
  if (needsPermission) {            // iOS : autorisation à demander via un geste
    shakeBtn.hidden = false;
    shakeBtn.addEventListener('click', askMotionPermission);
  } else {
    enableMotion();
  }
}

/* ---------- Son de choc (synthétisé) ---------- */
let audioCtx = null, lastClack = 0;
function clack(v) {
  const now = performance.now();
  if (now - lastClack < 35) return;
  lastClack = now;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const len = 0.05;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * len), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 4);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass';
    filter.frequency.value = rand(1800, 3200); filter.Q.value = 1.5;
    const gain = audioCtx.createGain(); gain.gain.value = Math.min(0.5, v / 30);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
  } catch (_) {}
}

/* ---------- Boucle ---------- */
let prev = performance.now();
let simTime = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  world.step(1 / 120, dt, 10);
  simTime += dt;

  let changed = false;
  for (const d of dice) {
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
    if (!d.rolling) continue;
    // Presque immobile pendant 0,3 s → on considère le dé arrêté
    const slow = d.body.velocity.length() < 0.3 && d.body.angularVelocity.length() < 0.8 && simTime - d.rollStart > 0.4;
    const flat = topAlignment(d) > 0.97;
    d.calm = slow && flat ? d.calm + dt : 0;
    // Coincé en équilibre sur une arête : petite pichenette
    d.stuck = slow && !flat ? (d.stuck || 0) + dt : 0;
    if (d.stuck > 0.6) {
      d.stuck = 0;
      d.body.wakeUp();
      d.body.velocity.y += 2;
      d.body.angularVelocity.set(rand(-4, 4), rand(-4, 4), rand(-4, 4));
    }
    if (d.calm > 0.3 || simTime - d.rollStart > 5) {
      d.rolling = false;
      d.body.velocity.setZero(); d.body.angularVelocity.setZero(); d.body.sleep();
      const L = readFace(d);
      d.value = L.value; d.text = L.text;
      changed = true;
    }
  }
  if (changed) updateResult();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

function makeFeltTexture() {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 225 + Math.random() * 30;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(40, 40);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------- Démarrage ---------- */
syncDice();
resize();
rollAll();
requestAnimationFrame(tick);

// accès pour tests
window.__dice = { setStyle: k => { styleKey = k; applyStyle(); }, dice, counts, syncDice, rollAll, camera, sim: () => simTime };
</script>
<script>
  setTimeout(function () { if (!window.__diceLoaded) document.getElementById('err').style.display = 'grid'; }, 8000);
</script>
